name: BrainBot checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
        working-directory: backend

  ml:
    name: ML API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: ml
      - run: pytest -q
        working-directory: ml

  mobile:
    name: Android bundle and type check
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx expo install --check
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npx expo export --platform android --output-dir ../artifacts/android-export
        working-directory: mobile
